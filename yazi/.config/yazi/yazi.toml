[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true

[preview]
tab_size    = 2
max_width   = 900
max_height  = 900
image_delay = 30

[opener]
edit = [
    { run = 'nvim "$@"', block = true },
]
open = [
    { run = 'xdg-open "$@"', desc = "Open" },
]

[open]
rules = [
    { url = "*/", use = [ "edit", "open" ] },
    { mime = "text/*",  use = [ "edit" ] },
    { mime = "image/*", use = [ "open" ] },
    { mime = "application/pdf", use = [ "open" ] },
    { mime = "*",       use = [ "open" ] },
] 
