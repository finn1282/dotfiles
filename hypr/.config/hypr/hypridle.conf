general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 4 min: dim screen and turn off keyboard light
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10% && brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume = brightnessctl -r && brightnessctl -rd tpacpi::kbd_backlight
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min: screen off
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 15 min: suspend, only on battery
listener {
    timeout = 900
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = 0 ] && systemctl suspend
}
