# hyprlock — your layout, wallpaper palette, fingerprint unlock
source = ~/.config/hypr/hyprlock-colors.conf

auth {
    fingerprint:enabled = true
    fingerprint:ready_message = Scan finger or type password
    fingerprint:present_message = Scanning…
}

background {
    monitor =
    color = $surface
    blur_passes = 3
    blur_size = 5
}

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $outline_variant
    inner_color = $surface_container
    font_color = $on_surface
    font_family = Inter
    fade_on_empty = false
    placeholder_text = <span foreground="##90909a">$FPRINTPROMPT</span>
    check_color = $primary
    fail_color = $error
    fail_text = $PAMFAIL
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $on_surface
    font_size = 96
    font_family = Inter Bold
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    color = $primary
    font_size = 22
    font_family = Inter
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $on_surface_variant
    font_size = 16
    font_family = Inter
    position = 0, -120
    halign = center
    valign = center
}
