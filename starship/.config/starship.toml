# Symphony's zen prompt, colored from the wallpaper palette (generated by matugen)
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 200
format = """$hostname$directory$git_branch$git_status$python$character"""
palette = "colors"

[palettes.colors]
primary = '#bac3ff'
secondary = '#c6c5d0'
muted = '#90909a'
error = '#ffb4ab'

[hostname]
ssh_only = true
style = "fg:primary"
format = "[@$hostname]($style) "

[directory]
style = "fg:primary bold"
read_only = " 󰌾"
read_only_style = "fg:error"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[character]
success_symbol = '[❯](fg:primary bold)'
error_symbol = '[❯](fg:error bold)'

[git_branch]
style = "fg:secondary"
format = '[$branch]($style) '

[git_status]
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = '[$all_status$ahead_behind](fg:muted) '

# Shows the active venv, handy with per-challenge virtualenvs
[python]
style = "fg:muted"
format = '[(\($virtualenv\) )]($style)'
detect_extensions = []
detect_files = []

[line_break]
disabled = true
